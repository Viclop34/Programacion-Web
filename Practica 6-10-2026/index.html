            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            font-weight: bold;

            margin-top: 10px;
        }
        button:hover {

        }
        #resultado {

            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #ddd;

    </style>
</head>
<body>

            </div>
            
            <div class="form-group">

            </div>
